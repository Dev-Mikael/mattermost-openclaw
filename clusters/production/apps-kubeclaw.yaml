apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-kubeclaw
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: infrastructure
    - name: apps-mattermost   # kubeclaw needs Mattermost running first
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/kubeclaw
  prune: true
  wait: false              # Don't block on OpenClawInstance readiness
  timeout: 15m0s
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-values