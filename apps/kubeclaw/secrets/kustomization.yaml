apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# sealed-kubeclaw-secret.yaml is generated by scripts/06-setup-kubeclaw.sh
# and committed here as an encrypted SealedSecret (safe to commit to git).
# The Sealed Secrets controller decrypts it into a real Secret at runtime.
#
# The real Secret (kubeclaw-secret) contains:
#   OPENCLAW_GATEWAY_TOKEN — gateway auth token
#   OPENAI_API_KEY         — OpenAI API key (used by litellm Deployment)
#   GEMINI_API_KEY         — Google Gemini API key (used by litellm Deployment)
#   LITELLM_MASTER_KEY     — litellm proxy master key (must start with sk-)
#   MATTERMOST_BOT_TOKEN   — bot token for Mattermost channel integration
#
# ⚠️ IMPORTANT: If you renamed ANTHROPIC_API_KEY → OPENAI_API_KEY, you MUST
# re-run scripts/06-setup-kubeclaw.sh to re-seal the secret with your actual
# OpenAI API key. The existing blob is stale. See sealed-kubeclaw-secret.yaml.
resources:
  - sealed-kubeclaw-secret.yaml
